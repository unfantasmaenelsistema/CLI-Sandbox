<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#bgGrad2)" rx="12" />

  <!-- Top Card: Interactive Permissions Calculator -->
  <rect x="24" y="24" width="1152" height="275" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="48" y="56" fill="#ffffff" font-size="17" font-weight="700" class="sans">Simulador Interactivo de Permisos POSIX (chmod) y Atributos NTFS (attrib)</text>
  <text x="48" y="76" fill="#94a3b8" font-size="12" class="sans">Experimenta con los bits octales (4=Lectura, 2=Escritura, 1=Ejecución) y comprueba su nivel de seguridad antes de enviarlos a consola.</text>

  <!-- Presets -->
  <rect x="750" y="42" width="100" height="26" rx="6" fill="#1e293b" />
  <text x="762" y="59" fill="#cbd5e1" font-size="11" class="mono">600 (SSH Key)</text>
  <rect x="860" y="42" width="105" height="26" rx="6" fill="#0284c7" opacity="0.2" stroke="#0ea5e9" stroke-width="1" />
  <text x="872" y="59" fill="#38bdf8" font-size="11" font-weight="700" class="mono">750 (Prod .sh)</text>
  <rect x="975" y="42" width="105" height="26" rx="6" fill="#1e293b" />
  <text x="987" y="59" fill="#cbd5e1" font-size="11" class="mono">644 (Config)</text>

  <line x1="48" y1="92" x2="1152" y2="92" stroke="#1e293b" stroke-width="1" />

  <!-- Matrix Columns -->
  <rect x="48" y="110" width="205" height="165" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="64" y="136" fill="#e2e8f0" font-size="13" font-weight="700" class="sans">Propietario (User)</text>
  <text x="220" y="136" fill="#38bdf8" font-size="15" font-weight="700" class="mono">7</text>
  <text x="64" y="170" fill="#34d399" font-size="12" class="mono">☑ Lectura (r = 4)</text>
  <text x="64" y="200" fill="#34d399" font-size="12" class="mono">☑ Escritura (w = 2)</text>
  <text x="64" y="230" fill="#34d399" font-size="12" class="mono">☑ Ejecución (x = 1)</text>

  <rect x="270" y="110" width="205" height="165" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="286" y="136" fill="#e2e8f0" font-size="13" font-weight="700" class="sans">Grupo (Group)</text>
  <text x="442" y="136" fill="#38bdf8" font-size="15" font-weight="700" class="mono">5</text>
  <text x="286" y="170" fill="#34d399" font-size="12" class="mono">☑ Lectura (r = 4)</text>
  <text x="286" y="200" fill="#64748b" font-size="12" class="mono">☐ Escritura (w = 2)</text>
  <text x="286" y="230" fill="#34d399" font-size="12" class="mono">☑ Ejecución (x = 1)</text>

  <rect x="492" y="110" width="205" height="165" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="508" y="136" fill="#e2e8f0" font-size="13" font-weight="700" class="sans">Otros (Others)</text>
  <text x="664" y="136" fill="#38bdf8" font-size="15" font-weight="700" class="mono">0</text>
  <text x="508" y="170" fill="#64748b" font-size="12" class="mono">☐ Lectura (r = 4)</text>
  <text x="508" y="200" fill="#64748b" font-size="12" class="mono">☐ Escritura (w = 2)</text>
  <text x="508" y="230" fill="#64748b" font-size="12" class="mono">☐ Ejecución (x = 1)</text>

  <!-- Right Result Box -->
  <rect x="720" y="110" width="432" height="165" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="740" y="138" fill="#94a3b8" font-size="12" class="sans">Resultado Octal / Simbólico:</text>
  <text x="980" y="138" fill="#34d399" font-size="16" font-weight="700" class="mono">750 · -rwxr-x---</text>
  <text x="740" y="175" fill="#7dd3fc" font-size="13" class="mono">$ chmod 750 deploy.sh</text>
  <rect x="1015" y="156" width="120" height="26" rx="5" fill="#059669" />
  <text x="1028" y="173" fill="#ffffff" font-size="11" font-weight="600" class="sans">▶ Ejecutar en Bash</text>

  <text x="740" y="215" fill="#7dd3fc" font-size="13" class="mono">&gt; attrib +r -h -s credenciales.txt</text>
  <rect x="1015" y="196" width="120" height="26" rx="5" fill="#0284c7" />
  <text x="1028" y="213" fill="#ffffff" font-size="11" font-weight="600" class="sans">▶ Ejecutar en CMD</text>

  <text x="740" y="255" fill="#34d399" font-size="11" class="sans">✓ Permisos Equilibrados (750): "Otros" no posee acceso de escritura ni lectura.</text>

  <!-- Bottom Section: Comparative Reference Dictionary -->
  <text x="24" y="335" fill="#ffffff" font-size="18" font-weight="700" class="sans">Diccionario Comparado de Comandos (Linux Bash vs Windows CMD / PowerShell)</text>

  <rect x="24" y="355" width="564" height="235" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="44" y="382" fill="#94a3b8" font-size="11" class="sans">Comprobación de Discos · Nivel de riesgo: Crítico (Root/Admin)</text>
  <text x="44" y="408" fill="#e2e8f0" font-size="12" class="sans">Verifica la integridad lógica del sistema de ficheros (ext4/NTFS) y repara sectores.</text>
  <rect x="44" y="426" width="250" height="75" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="58" y="448" fill="#34d399" font-size="11" font-weight="700" class="sans">GNU/Bash (Linux)</text>
  <text x="58" y="474" fill="#f8fafc" font-size="12" class="mono">sudo fsck -y /dev/sdb1</text>

  <rect x="314" y="426" width="250" height="75" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="328" y="448" fill="#38bdf8" font-size="11" font-weight="700" class="sans">CMD / PowerShell</text>
  <text x="328" y="474" fill="#f8fafc" font-size="12" class="mono">chkdsk D: /f /r</text>
  <text x="44" y="535" fill="#94a3b8" font-size="11" class="sans">Parámetros clave: -y (asumir sí en fsck) · /f (corregir errores) · /r (sectores dañados)</text>

  <rect x="612" y="355" width="564" height="235" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="632" y="382" fill="#94a3b8" font-size="11" class="sans">Herramientas de Sistema · Nivel de riesgo: Crítico (Root/Admin)</text>
  <text x="632" y="408" fill="#e2e8f0" font-size="12" class="sans">DISM repara el almacén WinSxS y SFC restaura librerías críticas (.dll) en System32.</text>
  <rect x="632" y="426" width="250" height="75" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="646" y="448" fill="#34d399" font-size="11" font-weight="700" class="sans">GNU/Bash (Linux)</text>
  <text x="646" y="474" fill="#f8fafc" font-size="12" class="mono">sudo systemctl restart nginx</text>

  <rect x="902" y="426" width="250" height="75" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="916" y="448" fill="#38bdf8" font-size="11" font-weight="700" class="sans">CMD / PowerShell</text>
  <text x="916" y="474" fill="#f8fafc" font-size="12" class="mono">dism /online /cleanup-image ...</text>
  <text x="632" y="535" fill="#94a3b8" font-size="11" class="sans">Parámetros clave: /RestoreHealth (almacén base WinSxS) · sfc /scannow</text>
</svg>
