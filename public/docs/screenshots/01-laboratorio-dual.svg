<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" rx="12" />

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1200" height="54" fill="#0f172a" />
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#1e293b" stroke-width="1" />
  <circle cx="34" cy="27" r="14" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
  <text x="28" y="32" fill="#38bdf8" font-size="14" font-weight="bold" class="mono">&gt;_</text>
  <text x="58" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="sans">CLI Sandbox · Un Fantasma en el Sistema</text>

  <!-- Nav Links -->
  <text x="430" y="32" fill="#ffffff" font-size="13" font-weight="600" class="sans">Laboratorio Dual</text>
  <line x1="430" y1="44" x2="535" y2="44" stroke="#0ea5e9" stroke-width="2" />
  <text x="565" y="32" fill="#94a3b8" font-size="13" font-weight="500" class="sans">Retos Guiados (12/16)</text>
  <text x="725" y="32" fill="#94a3b8" font-size="13" font-weight="500" class="sans">Referencia y Simulador</text>
  <text x="890" y="32" fill="#94a3b8" font-size="13" font-weight="500" class="sans">Logros y Certificado (10/12)</text>

  <!-- CTA Button -->
  <rect x="1015" y="13" width="165" height="28" rx="6" fill="#0284c7" />
  <text x="1030" y="31" fill="#ffffff" font-size="11" font-weight="600" class="sans">unfantasmaenelsistema.com ↗</text>

  <!-- Sub-Toolbar -->
  <rect x="0" y="55" width="1200" height="44" fill="#0f172a" opacity="0.6" />
  <line x1="0" y1="99" x2="1200" y2="99" stroke="#1e293b" stroke-width="1" />
  <rect x="24" y="63" width="125" height="28" rx="6" fill="#059669" />
  <text x="38" y="81" fill="#ffffff" font-size="11" font-weight="600" class="sans">GNU/Bash (Linux)</text>
  <rect x="155" y="63" width="170" height="28" rx="6" fill="#1e293b" />
  <text x="168" y="81" fill="#cbd5e1" font-size="11" font-weight="500" class="sans">CMD / PowerShell (Windows)</text>

  <rect x="345" y="63" width="215" height="28" rx="6" fill="#1e293b" />
  <text x="358" y="81" fill="#f8fafc" font-size="11" font-weight="600" class="sans">Modo Guiado  |  Modo Examen (+50% XP)</text>

  <text x="760" y="81" fill="#94a3b8" font-size="11" class="sans">Rango: <tspan fill="#f8fafc" font-weight="700">Arquitecto Senior de Sistemas</tspan> · Experiencia: <tspan fill="#38bdf8" font-weight="700">2.450 XP</tspan></text>

  <!-- LEFT COLUMN: Terminal Window -->
  <rect x="24" y="116" width="680" height="310" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  <rect x="24" y="116" width="680" height="36" rx="10" fill="#0f172a" />
  <text x="44" y="138" fill="#34d399" font-size="12" font-weight="600" class="mono">sysadmin@ghost-srv:/home/sysadmin</text>
  <rect x="385" y="123" width="115" height="22" rx="4" fill="#0284c7" opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
  <text x="395" y="138" fill="#7dd3fc" font-size="10" font-weight="600" class="sans">⬇ Exportar Log (.TXT)</text>
  <text x="515" y="138" fill="#94a3b8" font-size="10" class="sans">Limpiar pantalla · Borrar historial</text>

  <!-- Terminal Output Content -->
  <text x="40" y="174" fill="#34d399" font-size="12" font-weight="600" class="mono">sysadmin@ghost-srv:/home/sysadmin$ <tspan fill="#ffffff">chmod 600 id_rsa &amp;&amp; sudo chown root:www-data deploy.sh</tspan></text>
  <text x="48" y="194" fill="#cbd5e1" font-size="11" class="mono">Permisos de 'id_rsa' actualizados a 600 (rw-------)</text>
  <text x="48" y="210" fill="#cbd5e1" font-size="11" class="mono">Propietario de 'deploy.sh' cambiado a root:www-data</text>

  <text x="40" y="238" fill="#34d399" font-size="12" font-weight="600" class="mono">sysadmin@ghost-srv:/home/sysadmin$ <tspan fill="#ffffff">sudo fsck -y /dev/sdb1</tspan></text>
  <text x="48" y="258" fill="#cbd5e1" font-size="11" class="mono">fsck from util-linux 2.39.3 — e2fsck 1.47.0</text>
  <text x="48" y="274" fill="#cbd5e1" font-size="11" class="mono">Paso 1: Verificando inodos, bloques y tamaños... Inodo huérfano 18421 -&gt; CORREGIDO (-y)</text>
  <text x="48" y="290" fill="#34d399" font-size="11" class="mono">/dev/sdb1: ***** EL SISTEMA DE FICHEROS FUE MODIFICADO Y SANEADO [HEALTHY] *****</text>

  <!-- Active Prompt -->
  <text x="40" y="324" fill="#34d399" font-size="12" font-weight="600" class="mono">sysadmin@ghost-srv:/home/sysadmin$ <tspan fill="#94a3b8">cat /var/log/syslog | grep ERROR &gt; errores.log_</tspan></text>
  <rect x="618" y="308" width="72" height="24" rx="4" fill="#0284c7" />
  <text x="630" y="324" fill="#ffffff" font-size="11" font-weight="600" class="sans">Ejecutar ↵</text>

  <!-- Quick Command Strip -->
  <rect x="25" y="390" width="678" height="35" fill="#0f172a" />
  <text x="40" y="412" fill="#94a3b8" font-size="11" class="sans">Comandos rápidos:</text>
  <rect x="145" y="397" width="55" height="20" rx="4" fill="#1e293b" />
  <text x="155" y="411" fill="#e2e8f0" font-size="10" class="mono">ls -la</text>
  <rect x="208" y="397" width="68" height="20" rx="4" fill="#1e293b" />
  <text x="218" y="411" fill="#e2e8f0" font-size="10" class="mono">ss -tulnp</text>
  <rect x="284" y="397" width="110" height="20" rx="4" fill="#1e293b" />
  <text x="294" y="411" fill="#e2e8f0" font-size="10" class="mono">sudo ufw enable</text>
  <rect x="402" y="397" width="135" height="20" rx="4" fill="#1e293b" />
  <text x="412" y="411" fill="#e2e8f0" font-size="10" class="mono">sha256sum deploy.sh</text>

  <!-- LEFT BOTTOM: Live System Telemetry -->
  <rect x="24" y="442" width="680" height="210" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="44" y="470" fill="#f8fafc" font-size="14" font-weight="700" class="sans">Telemetría en Vivo del Entorno (Linux POSIX)</text>
  <text x="44" y="488" fill="#94a3b8" font-size="11" class="sans">Ficheros y Permisos  ·  Discos e Integridad  ·  Procesos  ·  Red y Firewall</text>
  <line x1="44" y1="500" x2="684" y2="500" stroke="#1e293b" stroke-width="1" />

  <text x="44" y="522" fill="#94a3b8" font-size="11" class="mono">NOMBRE               TIPO        PERMISOS (OCTAL)      PROPIETARIO         TAMAÑO</text>
  <text x="44" y="546" fill="#f8fafc" font-size="11" class="mono">📁 backups           Directorio  <tspan fill="#34d399">rwxr-xr-x (755)</tspan>       sysadmin:sysadmin   4096 B</text>
  <text x="44" y="570" fill="#f8fafc" font-size="11" class="mono">📄 id_rsa            Fichero     <tspan fill="#34d399">rw------- (600)</tspan>       sysadmin:sysadmin   1679 B</text>
  <text x="44" y="594" fill="#f8fafc" font-size="11" class="mono">📄 deploy.sh         Fichero     <tspan fill="#34d399">rwxr-x--- (750)</tspan>       root:www-data        840 B</text>
  <text x="44" y="618" fill="#f8fafc" font-size="11" class="mono">📄 errores.log       Fichero     <tspan fill="#34d399">rw-r--r-- (644)</tspan>       sysadmin:sysadmin    412 B</text>

  <!-- RIGHT COLUMN TOP: Guided Challenge Deck -->
  <rect x="724" y="116" width="452" height="295" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="744" y="142" fill="#94a3b8" font-size="11" class="sans">Reto 06 de 16 · Comprobación de Discos · Intermedio · <tspan fill="#f8fafc" font-weight="700">160 XP</tspan></text>
  <text x="744" y="168" fill="#ffffff" font-size="16" font-weight="700" class="sans">06. Recuperación de Partición ext4 (FSCK)</text>
  <text x="744" y="190" fill="#cbd5e1" font-size="11" class="sans">El volumen /dev/sdb1 presenta inodos huérfanos en el superbloque ext4.</text>

  <rect x="744" y="208" width="412" height="54" rx="8" fill="#064e3b" opacity="0.25" stroke="#10b981" stroke-width="1" />
  <text x="760" y="230" fill="#34d399" font-size="12" font-weight="700" class="sans">✓ Paso 1: Verifica los discos y particiones con lsblk o df -h</text>
  <text x="760" y="248" fill="#a7f3d0" font-size="11" class="mono">Comando verificado: lsblk</text>

  <rect x="744" y="272" width="412" height="54" rx="8" fill="#064e3b" opacity="0.25" stroke="#10b981" stroke-width="1" />
  <text x="760" y="294" fill="#34d399" font-size="12" font-weight="700" class="sans">✓ Paso 2: Repara automáticamente inodos en /dev/sdb1 con fsck -y</text>
  <text x="760" y="312" fill="#a7f3d0" font-size="11" class="mono">Comando verificado: sudo fsck -y /dev/sdb1</text>

  <rect x="744" y="346" width="120" height="28" rx="6" fill="#1e293b" />
  <text x="758" y="364" fill="#cbd5e1" font-size="11" font-weight="600" class="sans">← Reto Anterior</text>
  <rect x="1036" y="346" width="120" height="28" rx="6" fill="#0284c7" />
  <text x="1050" y="364" fill="#ffffff" font-size="11" font-weight="600" class="sans">Siguiente Reto →</text>

  <!-- RIGHT COLUMN BOTTOM: Immediate Didactic Feedback -->
  <rect x="724" y="427" width="452" height="225" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="744" y="454" fill="#ffffff" font-size="14" font-weight="700" class="sans">Retroalimentación Didáctica Inmediata</text>
  <rect x="744" y="466" width="412" height="28" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="756" y="484" fill="#38bdf8" font-size="12" font-weight="600" class="mono">$ sudo fsck -y /dev/sdb1</text>

  <text x="744" y="514" fill="#cbd5e1" font-size="11" class="sans">Equivalencia: <tspan fill="#38bdf8" class="mono">Windows: chkdsk D: /f /r  ↔  Linux: sudo fsck -y /dev/sdb1</tspan></text>
  <text x="744" y="538" fill="#f8fafc" font-size="11" font-weight="600" class="mono">sudo    <tspan fill="#94a3b8" class="sans">— Eleva privilegios a root para acceder al dispositivo de bloques.</tspan></text>
  <text x="744" y="558" fill="#f8fafc" font-size="11" font-weight="600" class="mono">fsck -y <tspan fill="#94a3b8" class="sans">— Invoca e2fsck y asume 'sí' a la corrección de inodos huérfanos.</tspan></text>

  <rect x="744" y="576" width="412" height="58" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="756" y="596" fill="#f8fafc" font-size="11" font-weight="700" class="sans">Regla de Oro de Seguridad / Producción:</text>
  <text x="756" y="614" fill="#94a3b8" font-size="10.5" class="sans">Nunca ejecutes fsck sobre una partición montada en lectura/escritura activa</text>
  <text x="756" y="628" fill="#94a3b8" font-size="10.5" class="sans">sin antes desmontarla (umount) o montarla en modo solo lectura.</text>
</svg>
